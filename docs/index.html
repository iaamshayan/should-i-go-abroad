<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A free readiness check for Pakistani workers considering Saudi Arabia, the UAE or Qatar: a score out of 100, the traps that sink people, and what to do before you go and after you land.">
<meta property="og:title" content="Should I Go Abroad?">
<meta property="og:description" content="A free readiness check for Pakistani workers considering Saudi Arabia, the UAE or Qatar: a score out of 100, the traps that sink people, and what to do before you go and after you land.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
<title>Should I Go Abroad?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Libre+Franklin:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ============ tokens: light is the base, both themes redefined below ============ */
:root{
  --ground:#F5F4EF; --surface:#FFFFFF; --surface-2:#FAF9F5;
  --ink:#141F1D; --ink-2:#4B5755; --ink-3:#7C8785;
  --rule:#DEDCD3; --rule-2:#EAE8E0;
  --accent:#0F6F62; --accent-ink:#0B5349; --accent-soft:#E2EFEC;
  --go:#1E6B42; --close:#6F5A0E; --wait:#9A530E; --stop:#98281F;
  --go-soft:#E4EFE7; --close-soft:#F3EEDB; --wait-soft:#F6EADC; --stop-soft:#F6E4E1;
  --bar:#2E8578; --bar-track:#E9E7DE;
  --on-accent:#FFFFFF;
  --shadow:0 1px 2px rgba(20,31,29,.06),0 8px 24px -12px rgba(20,31,29,.18);
  --focus:#0F6F62;
  --maxw:41rem;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#101614; --surface:#18201E; --surface-2:#1D2624;
    --ink:#ECEDE7; --ink-2:#AAB4B1; --ink-3:#818B89;
    --rule:#2C3735; --rule-2:#242E2C;
    --accent:#54BFAC; --accent-ink:#7FD4C4; --accent-soft:#17302C;
    --go:#66C48D; --close:#CBB25A; --wait:#DE9A55; --stop:#E5837A;
    --go-soft:#16281E; --close-soft:#2A2617; --wait-soft:#2C2318; --stop-soft:#2E1C1A;
    --bar:#3E9C8C; --bar-track:#242E2C;
    --on-accent:#08211D;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
    --focus:#7FD4C4;
  }
}
:root[data-theme="dark"]{
  --ground:#101614; --surface:#18201E; --surface-2:#1D2624;
  --ink:#ECEDE7; --ink-2:#AAB4B1; --ink-3:#818B89;
  --rule:#2C3735; --rule-2:#242E2C;
  --accent:#54BFAC; --accent-ink:#7FD4C4; --accent-soft:#17302C;
  --go:#66C48D; --close:#CBB25A; --wait:#DE9A55; --stop:#E5837A;
  --go-soft:#16281E; --close-soft:#2A2617; --wait-soft:#2C2318; --stop-soft:#2E1C1A;
  --bar:#3E9C8C; --bar-track:#242E2C;
  --on-accent:#08211D;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  --focus:#7FD4C4;
}

*{box-sizing:border-box}
body{
  background:var(--ground); color:var(--ink);
  font:400 16px/1.6 "Libre Franklin",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  margin:0; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:"Zilla Slab",Georgia,serif;text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:clamp(1.7rem,5vw,2.3rem);font-weight:700;letter-spacing:-.01em}
h2{font-size:1.35rem;font-weight:600}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
a{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.eyebrow{
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.7rem;font-weight:500;
  letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);
}

/* ============ shell ============ */
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 1.15rem}
.wrap.wide{max-width:54rem}

header.top{
  position:sticky;top:0;z-index:20;background:var(--ground);
  border-bottom:1px solid var(--rule);
}
.topbar{max-width:54rem;margin:0 auto;padding:.7rem 1.15rem;display:flex;align-items:center;gap:.75rem}
.brand{font-family:"Zilla Slab",Georgia,serif;font-weight:600;font-size:1rem;letter-spacing:-.01em}
.brand em{font-style:normal;color:var(--accent-ink)}
.topbar .spacer{flex:1}
.chip{
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.68rem;letter-spacing:.06em;
  text-transform:uppercase;padding:.22rem .5rem;border:1px solid var(--rule);
  border-radius:999px;color:var(--ink-3);background:var(--surface);white-space:nowrap;
}
.progress{height:3px;background:var(--rule-2)}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s ease}

main{padding:1.75rem 0 5rem}
.stack{display:flex;flex-direction:column;gap:1.15rem}
.stack.tight{gap:.7rem}
.stack.loose{gap:2rem}

/* ============ buttons ============ */
button{font:inherit;cursor:pointer}
.btn{
  font-family:"Libre Franklin",sans-serif;font-weight:600;font-size:.95rem;
  padding:.72rem 1.3rem;border-radius:6px;border:1px solid transparent;
  background:var(--accent);color:var(--on-accent);transition:filter .15s;
}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--ink-2);border-color:var(--rule)}
.btn.ghost:hover{background:var(--surface);filter:none}
.btn.small{padding:.45rem .8rem;font-size:.85rem}
.nav{display:flex;gap:.6rem;align-items:center;padding-top:.4rem}
.nav .spacer{flex:1}

/* ============ question cards ============ */
.qgroup{
  background:var(--surface);border:1px solid var(--rule);border-radius:9px;
  padding:1.15rem;box-shadow:var(--shadow);
}
.qgroup + .qgroup{margin-top:.85rem}
.qhead{display:flex;gap:.6rem;align-items:baseline;margin-bottom:.15rem}
.qnum{
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.78rem;font-weight:500;
  color:var(--ink-3);flex:none;padding-top:.1rem;
}
.qtext{font-weight:600;font-size:1rem;line-height:1.45}
.qhelp{font-size:.86rem;color:var(--ink-2);margin:.35rem 0 0;padding-left:1.9rem}
.opts{display:flex;flex-direction:column;gap:.3rem;margin-top:.75rem;padding-left:1.9rem}
.opt{
  display:flex;gap:.6rem;align-items:flex-start;padding:.55rem .7rem;
  border:1px solid var(--rule-2);border-radius:6px;background:var(--surface-2);
  cursor:pointer;transition:border-color .12s,background .12s;
}
.opt:hover{border-color:var(--accent);background:var(--accent-soft)}
.opt input{
  appearance:none;width:1.05rem;height:1.05rem;flex:none;margin:.22rem 0 0;
  border:1.5px solid var(--ink-3);border-radius:50%;background:var(--surface);
}
.opt input:checked{border:5px solid var(--accent);background:var(--surface)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt span{font-size:.93rem;line-height:1.45}
.opt .pts{
  margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:.75rem;
  color:var(--ink-3);flex:none;padding-top:.12rem;
}
@media (max-width:420px){
  .qhelp,.opts{padding-left:0}
}

/* ============ section intro ============ */
.sechead{display:flex;align-items:baseline;gap:.7rem;flex-wrap:wrap}
.sechead .max{margin-left:auto}

/* ============ callouts ============ */
.note{
  border-left:3px solid var(--accent);background:var(--accent-soft);
  padding:.85rem 1rem;border-radius:0 6px 6px 0;font-size:.9rem;color:var(--ink-2);
}
.alarm{
  border:1px solid var(--stop);background:var(--stop-soft);border-radius:8px;padding:1.1rem 1.15rem;
}
.alarm h3{color:var(--stop);display:flex;gap:.5rem;align-items:baseline}
.alarm p{margin-top:.45rem;font-size:.93rem;color:var(--ink-2)}
.caution{
  border:1px solid var(--rule);border-left:3px solid var(--wait);background:var(--wait-soft);
  border-radius:0 8px 8px 0;padding:.95rem 1.1rem;
}
.caution h3{color:var(--wait);font-size:.98rem}
.caution p{margin-top:.35rem;font-size:.9rem;color:var(--ink-2)}

/* ============ verdict ============ */
.verdict{border-radius:10px;padding:1.5rem 1.35rem;border:1px solid var(--rule);background:var(--surface)}
.verdict[data-tone="go"]{border-color:var(--go);background:var(--go-soft)}
.verdict[data-tone="close"]{border-color:var(--close);background:var(--close-soft)}
.verdict[data-tone="wait"]{border-color:var(--wait);background:var(--wait-soft)}
.verdict[data-tone="stop"]{border-color:var(--stop);background:var(--stop-soft)}
.verdict h2{font-size:clamp(1.35rem,4.2vw,1.8rem);margin-top:.3rem}
.verdict[data-tone="go"] h2{color:var(--go)}
.verdict[data-tone="close"] h2{color:var(--close)}
.verdict[data-tone="wait"] h2{color:var(--wait)}
.verdict[data-tone="stop"] h2{color:var(--stop)}
.verdict p{margin-top:.6rem;color:var(--ink-2);font-size:.95rem}

.scoreline{display:flex;align-items:flex-end;gap:.9rem;margin-top:1rem;flex-wrap:wrap}
.bignum{
  font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:3.1rem;line-height:.95;
  letter-spacing:-.03em;color:var(--ink);
}
.bignum small{font-size:1.1rem;font-weight:400;color:var(--ink-3);letter-spacing:0}
.scoreline .cap{font-size:.85rem;color:var(--ink-2);padding-bottom:.25rem;max-width:22rem}

/* ============ breakdown chart ============ */
.chart{display:flex;flex-direction:column;gap:.55rem}
.row{display:grid;grid-template-columns:1fr auto;gap:.15rem .6rem;align-items:baseline}
.row .name{font-size:.9rem;font-weight:500}
.row .val{
  font-family:"IBM Plex Mono",monospace;font-size:.82rem;color:var(--ink-2);
  font-variant-numeric:tabular-nums;
}
.row .track{
  grid-column:1/-1;height:9px;background:var(--bar-track);border-radius:4px;overflow:hidden;
}
.row .fill{display:block;height:100%;background:var(--bar);border-radius:0 4px 4px 0}
.row[data-focus="1"] .fill{background:var(--wait)}
.row .flag{
  font-family:"IBM Plex Mono",monospace;font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--wait);border:1px solid var(--wait);border-radius:3px;padding:.02rem .28rem;margin-left:.4rem;
}

/* ============ advice lists ============ */
.items{display:flex;flex-direction:column;gap:.1rem}
.item{padding:.9rem 0;border-top:1px solid var(--rule)}
.item:first-child{border-top:none;padding-top:.2rem}
.item h3{margin-bottom:.3rem}
.item p{font-size:.92rem;color:var(--ink-2)}
.item .tag{
  font-family:"IBM Plex Mono",monospace;font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;
  color:var(--accent-ink);display:block;margin-bottom:.3rem;
}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:9px;padding:1.2rem 1.25rem}

/* ============ country picker ============ */
.countries{display:grid;gap:.6rem;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr))}
.country{
  display:flex;gap:.75rem;align-items:center;text-align:left;width:100%;
  background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:.9rem 1rem;
  transition:border-color .12s,transform .12s;
}
.country:hover{border-color:var(--accent);transform:translateY(-1px)}
.country .fl{font-size:1.6rem;line-height:1;flex:none}
.country b{display:block;font-family:"Zilla Slab",serif;font-size:1.05rem;font-weight:600}
.country small{color:var(--ink-3);font-size:.76rem}

/* ============ admin ============ */
.admin-bar{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:.3rem;border-bottom:1px solid var(--rule);margin-bottom:1rem;flex-wrap:wrap}
.tab{
  background:none;border:none;border-bottom:2px solid transparent;padding:.5rem .75rem;
  font-size:.9rem;font-weight:500;color:var(--ink-3);margin-bottom:-1px;
}
.tab[aria-selected="true"]{color:var(--accent-ink);border-bottom-color:var(--accent)}
.ed{display:flex;flex-direction:column;gap:.5rem}
.ed label{font-size:.78rem;color:var(--ink-3);font-weight:500}
.ed input,.ed textarea{
  font:inherit;font-size:.9rem;width:100%;padding:.45rem .6rem;background:var(--surface-2);
  color:var(--ink);border:1px solid var(--rule);border-radius:5px;
}
.ed textarea{min-height:4.5rem;resize:vertical;line-height:1.5}
.ed .num{width:4.5rem;font-family:"IBM Plex Mono",monospace}
.edrow{display:flex;gap:.5rem;align-items:center}
.edrow input[type=text]{flex:1}
.edq{border:1px solid var(--rule-2);border-radius:7px;padding:.8rem;background:var(--surface-2)}
.edq + .edq{margin-top:.55rem}
.tally{font-family:"IBM Plex Mono",monospace;font-size:.8rem}
.tally.bad{color:var(--stop);font-weight:600}
.tally.good{color:var(--go)}
table.subs{width:100%;border-collapse:collapse;font-size:.85rem}
table.subs th,table.subs td{text-align:left;padding:.5rem .6rem;border-bottom:1px solid var(--rule-2);white-space:nowrap}
table.subs th{font-family:"IBM Plex Mono",monospace;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}
table.subs td.n{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.scroller{overflow-x:auto;-webkit-overflow-scrolling:touch}
.hidden{display:none!important}
.saveline{font-size:.8rem;color:var(--ink-3);display:flex;align-items:center;gap:.4rem}

@media print{
  header.top,.nav,.noprint{display:none!important}
  body{background:#fff}
  .panel,.qgroup,.verdict{box-shadow:none;break-inside:avoid}
}
</style>
</head>
<body>
<header class="top noprint">
  <div class="topbar">
    <span class="brand">Should I Go <em>Abroad?</em></span>
    <span class="spacer"></span>
    <span class="chip" id="ctxChip" hidden></span>
    <button class="btn ghost small hidden" id="adminBtn" type="button">Admin</button>
    <button class="btn ghost small hidden" id="restartBtn" type="button">Start over</button>
  </div>
  <div class="progress"><i id="progressBar" style="width:0%"></i></div>
</header>

<main>
  <div class="wrap" id="view"></div>
</main>

<script>
/* ================= country packs (injected at build) ================= */
var PACKS = {};
/* Country pack: Saudi Arabia
 * Scored sections adapted from the owner's own scorecard (Ksa Score table.xlsx).
 * Knockouts and Section H added from research — see AUTHORING.md.
 */
PACKS["saudi-arabia"] = {
  id: "saudi-arabia",
  name: "Saudi Arabia",
  flag: "\u{1F1F8}\u{1F1E6}",
  origin: "Pakistan",
  authored: "owner",
  updated: "2026-09-08",

  intro: "For a Pakistan-based worker weighing a move to the Kingdom. Answer honestly — a flattering score helps nobody.",

  /* ---- Stage 0: unscored knockouts. A "stop" answer overrides the band. ---- */
  knockouts: [
    {
      id: "k-visa",
      text: "What visa will you actually travel on?",
      help: "This is the single most common way Pakistani workers lose everything.",
      options: [
        { label: "A work visa (block/employment visa) naming me and my employer", severity: "ok" },
        { label: "A visit or Umrah visa — I've been told it converts to work there", severity: "stop" },
        { label: "A visit visa, and I'll job-hunt after I arrive", severity: "stop" },
        { label: "I don't know yet — the agent hasn't told me", severity: "stop" }
      ],
      stopTitle: "You are being set up to become undocumented",
      stopBody: "A visit or Umrah visa does not convert into a work visa. Workers sent this way become illegal the day the visa expires — unable to work legally, unable to leave without penalty, and at risk of detention and deportation. Pakistani missions have repeatedly warned about agents selling visit visas as jobs. Do not travel until you hold a work visa with your name and your employer on it."
    },
    {
      id: "k-contract",
      text: "Do you have a written employment contract that you have read, before departure?",
      options: [
        { label: "Yes — signed, with salary, hours, benefits and end-of-service in writing", severity: "ok" },
        { label: "An offer letter, but not a full contract", severity: "warn" },
        { label: "Only a verbal or WhatsApp promise", severity: "stop" },
        { label: "No", severity: "stop" }
      ],
      stopTitle: "You have nothing to enforce",
      stopBody: "A promise you cannot show a court, a ministry or an embassy is not a job. Salary, hours, benefits, end-of-service and who pays for the ticket must be written down and signed before you get on a plane. Ask for the contract, take it away, and read it without the agent in the room.",
      warnTitle: "An offer letter is not a contract",
      warnBody: "Offer letters routinely differ from the contract handed over on arrival. Get the full contract in writing and compare it line by line before you travel."
    },
    {
      id: "k-beoe",
      text: "Is your recruiter a BEOE-licensed Overseas Employment Promoter, and will your contract be stamped by the Protectorate of Emigrants?",
      help: "Protection is legally required under the Emigration Ordinance 1979.",
      options: [
        { label: "Yes — I verified the licence myself and protection is arranged", severity: "ok" },
        { label: "The agent says yes, but I haven't verified it", severity: "warn" },
        { label: "No — going through a personal contact, without protection", severity: "stop" },
        { label: "I don't know what this is", severity: "stop" }
      ],
      stopTitle: "You would be travelling outside Pakistan's legal protection",
      stopBody: "Every Pakistani going abroad on a work visa is legally required to have their Foreign Service Agreement protected by the Protectorate of Emigrants. Protection is what entitles you to help from the Pakistani mission in Saudi Arabia if the employer breaks the contract. Without it you are on your own. Verify your agent's licence on beoe.gov.pk before paying anyone anything.",
      warnTitle: "Verify the licence yourself",
      warnBody: "An agent's word about their own licence is worth nothing. The BEOE publishes the list of active OEP licences — check it yourself on beoe.gov.pk, and confirm the specific office you are dealing with."
    },
    {
      id: "k-money",
      text: "Has anyone asked you for money beyond documented, receipted government fees?",
      options: [
        { label: "No — only official fees, with receipts", severity: "ok" },
        { label: "A modest amount, and I got a receipt", severity: "warn" },
        { label: "A large amount in cash, with no receipt", severity: "stop" }
      ],
      stopTitle: "This is the standard shape of a recruitment scam",
      stopBody: "Large unreceipted cash demands are the defining feature of overseas job fraud in Pakistan — people lose their savings and their land to it every year. A legitimate employer does not charge you to be hired. Stop paying, keep every message and receipt you already have, and verify the employer independently using contact details you found yourself, not ones the agent gave you.",
      warnTitle: "Keep every receipt",
      warnBody: "Even documented fees are worth checking against the official schedule. Keep the paperwork — it is your evidence if the placement goes wrong."
    },
    {
      id: "k-licence",
      text: "Does your profession require Saudi licensing or credential verification — and have you started it?",
      help: "Dataflow primary-source verification, Mumaris+/SCFHS for health workers, Saudi Council of Engineers for engineers.",
      options: [
        { label: "Not required for my profession — I checked", severity: "ok" },
        { label: "Required, and my verification/licence is complete", severity: "ok" },
        { label: "Required — started but not finished", severity: "warn" },
        { label: "Required — I haven't started", severity: "stop" },
        { label: "I don't know whether it's required", severity: "stop" }
      ],
      stopTitle: "You may not be allowed to practise your profession",
      stopBody: "Regulated professions cannot legally work in the Kingdom without verification and a licence. Health workers need Dataflow primary-source verification, then eligibility and registration through Mumaris+/SCFHS; engineers need Saudi Council of Engineers registration. Dataflow contacts your universities and past employers directly, so it takes weeks to months — and any gap or exaggeration in your documents surfaces there. Find out what your profession requires and start before you commit to anything.",
      warnTitle: "Finish the licensing before you travel",
      warnBody: "An incomplete verification can leave you in the country unable to work legally while your savings drain. Get the positive Dataflow report and the eligibility decision in hand first."
    },
    {
      id: "k-saudization",
      text: "Is your target job in a category being localised under Saudization (Nitaqat)?",
      help: "The 2026–2028 phase reserves a large and growing set of roles for Saudi nationals.",
      options: [
        { label: "No — I checked, my field still hires expatriates", severity: "ok" },
        { label: "Partly — my field has quotas but still hires expats", severity: "warn" },
        { label: "Yes — admin support, HR, accounting clerical, customer service or reception", severity: "stop" },
        { label: "I don't know", severity: "warn" }
      ],
      stopTitle: "You are targeting roles that are closing to foreigners",
      stopBody: "Saudi Arabia is running a three-year plan to localise hundreds of thousands of private-sector jobs. Sixty-nine administrative-support professions now require 100% Saudi staffing in any firm employing even one person in those roles, and sales and marketing roles carry a 60% localisation requirement. Chasing these jobs from Pakistan is chasing a shrinking door. Healthcare specialisms and technical/IT roles still carry lower localisation targets — aim there instead.",
      warnTitle: "Check the localisation rules for your specific role",
      warnBody: "Quotas differ sharply by sector and job title. Knowing exactly where your role sits changes which employers can realistically hire you."
    }
  ],

  /* ---- Stage 1: scored sections, 100 points ---- */
  sections: [
    {
      id: "A", name: "Education & qualification", max: 12,
      questions: [
        { text: "What is your highest level of education?", options: [
          { label: "Master's or PhD", points: 4 },
          { label: "Bachelor's", points: 3 },
          { label: "Diploma", points: 2 },
          { label: "High school", points: 1 },
          { label: "Below high school", points: 0 } ] },
        { text: "Is your education relevant to the work you want to do in Saudi Arabia?", options: [
          { label: "Highly relevant", points: 4 },
          { label: "Somewhat relevant", points: 2 },
          { label: "Not relevant", points: 0 } ] },
        { text: "Do you hold professional or technical certifications relevant to your target job?", options: [
          { label: "Multiple relevant certifications", points: 2 },
          { label: "One relevant certification", points: 1 },
          { label: "Only unrelated certifications, or none", points: 0 } ] },
        { text: "Are your degree and documents attested (HEC, MOFA, Saudi embassy)?", options: [
          { label: "All attested and in hand", points: 2 },
          { label: "In progress", points: 1 },

/* ================= tiny helpers ================= */
var $ = function(s,r){ return (r||document).querySelector(s); };
function el(tag, attrs, kids){
  var n = document.createElement(tag);
  if (attrs) for (var k in attrs){
    if (k === "class") n.className = attrs[k];
    else if (k === "html") n.innerHTML = attrs[k];
    else if (k === "text") n.textContent = attrs[k];
    else if (k.slice(0,2) === "on") n.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] !== null && attrs[k] !== undefined) n.setAttribute(k, attrs[k]);
  }
  (kids || []).forEach(function(c){ if (c) n.appendChild(c); });
  return n;
}
function maxPts(q){ return q.options.reduce(function(m,o){ return Math.max(m, o.points||0); }, 0); }

/* ================= state ================= */
var S = {
  packId: null,
  step: "pick",      // pick | knockouts | sec:<i> | result
  knock: {},         // knockoutId -> option index
  ans: {},           // "<secId>.<qIdx>" -> option index
  saved: null        // submission id, when recorded
};
var DB = null, IS_ADMIN = false, ADMIN_VIEW = false;

function pack(){ return PACKS[S.packId]; }
function packList(){ return Object.keys(PACKS).map(function(k){ return PACKS[k]; }); }

/* ================= scoring ================= */
function score(){
  var p = pack(), total = 0, max = 0, sections = [];
  p.sections.forEach(function(sec){
    var got = 0, m = 0;
    sec.questions.forEach(function(q, i){
      m += maxPts(q);
      var pick = S.ans[sec.id + "." + i];
      if (pick !== undefined && q.options[pick]) got += (q.options[pick].points || 0);
    });
    sections.push({ id: sec.id, name: sec.name, got: got, max: m, pct: m ? got/m : 0, gap: sec.gap });
    total += got; max += m;
  });
  var stops = [], warns = [];
  p.knockouts.forEach(function(k){
    var pick = S.knock[k.id];
    if (pick === undefined) return;
    var sev = (k.options[pick] || {}).severity;
    if (sev === "stop") stops.push(k);
    else if (sev === "warn") warns.push(k);
  });
  var band = p.bands.filter(function(b){ return total >= b.min; })[0] || p.bands[p.bands.length-1];
  var focus = sections.slice()
    .filter(function(s){ return s.pct < 0.7; })
    .sort(function(a,b){ return a.pct - b.pct; })
    .slice(0,3);
  if (!focus.length){
    focus = sections.slice().sort(function(a,b){ return a.pct - b.pct; })
      .filter(function(s){ return s.pct < 1; }).slice(0,1);
  }
  return { total: total, max: max, sections: sections, stops: stops, warns: warns, band: band, focus: focus };
}

/* ================= progress ================= */
function setProgress(){
  var p = pack(), pctDone = 0;
  if (!p) pctDone = 0;
  else if (S.step === "result") pctDone = 100;
  else {
    var totalQ = p.knockouts.length + p.sections.reduce(function(a,s){ return a + s.questions.length; }, 0);
    var done = Object.keys(S.knock).length + Object.keys(S.ans).length;
    pctDone = totalQ ? Math.round(done/totalQ*100) : 0;
  }
  $("#progressBar").style.width = pctDone + "%";
  var chip = $("#ctxChip");
  if (p && S.step !== "pick"){ chip.hidden = false; chip.textContent = p.flag + " " + p.name; }
  else chip.hidden = true;
  $("#restartBtn").classList.toggle("hidden", S.step === "pick");
}

/* ================= views ================= */
function render(){
  var v = $("#view");
  v.innerHTML = "";
  v.className = (S.step === "result" || ADMIN_VIEW) ? "wrap wide" : "wrap";
  if (ADMIN_VIEW) renderAdmin(v);
  else if (S.step === "pick") renderPick(v);
  else if (S.step === "knockouts") renderKnockouts(v);
  else if (S.step.slice(0,4) === "sec:") renderSection(v, +S.step.slice(4));
  else if (S.step === "result") renderResult(v);
  setProgress();
  window.scrollTo(0,0);
}

/* disable Next until everything on screen is answered */
function syncNav(){
  var btn = $("#next");
  if (!btn) return;
  var p = pack(), missing = 0;
  if (S.step === "knockouts") p.knockouts.forEach(function(k){ if (S.knock[k.id] === undefined) missing++; });
  else if (S.step.slice(0,4) === "sec:"){
    var sec = p.sections[+S.step.slice(4)];
    sec.questions.forEach(function(q,i){ if (S.ans[sec.id + "." + i] === undefined) missing++; });
  }
  btn.disabled = missing > 0;
  btn.title = missing ? missing + " question" + (missing>1?"s":"") + " left on this page" : "";
}

function renderResult(v){
  var p = pack(), r = score();

  var vBody = stopped
    ? "You scored " + r.total + " out of " + r.max + ", but your score is not the problem. " +
      (r.stops.length === 1 ? "One answer" : r.stops.length + " answers") +
      " above describes something that can cost you your money, your legal status or your freedom — regardless of how well prepared you are otherwise. Resolve " +

/* ================= db: submissions ================= */
function recordSubmission(r){
  if (!DB || S.saved) return;
  var line = $("#saveline");
  var body = {
    country: S.packId,
    countryName: pack().name,
    score: r.total,
    max: r.max,
    band: r.stops.length ? "STOP (knockout)" : r.band.title,
    stops: r.stops.map(function(k){ return k.id; }),
    warns: r.warns.map(function(k){ return k.id; }),
    sections: r.sections.map(function(s){ return { id: s.id, got: s.got, max: s.max }; }),
    knockAnswers: S.knock,
    answers: S.ans,
    at: new Date().toISOString()
  };
  DB.collection("submissions").add(body).then(function(ref){
    S.saved = ref.id;
    if (line) line.textContent = "Recorded for review";
  }).catch(function(e){
    if (line) line.textContent = e && e.code === "quota_exceeded"
      ? "Not recorded — the record store is full"
      : "Not recorded";
  });
}

  if (!editingPack){
    wrap.appendChild(el("p", { text: "Pick a country to edit its questions, answer options, points and verdict bands.", style: "color:var(--ink-2);font-size:.93rem" }));
    var grid = el("div", { class: "countries" });
    packList().forEach(function(p){
      grid.appendChild(el("button", { class: "country", type: "button", onclick: function(){ editingPack = p.id; render(); } }, [
        el("span", { class: "fl", text: p.flag }),
        el("span", {}, [ el("b", { text: p.name }),
          el("small", { text: p.authored === "owner" ? "Your content" : "Researched — needs your review" }) ])
      ]));
    });
    wrap.appendChild(grid);
    return wrap;
  }

  var p = PACKS[editingPack];
  wrap.appendChild(el("div", { class: "admin-bar" }, [
    el("button", { class: "btn ghost small", type: "button", text: "← All countries", onclick: function(){ editingPack = null; render(); } }),
    el("span", { class: "chip", text: p.flag + " " + p.name }),
    el("span", { class: "spacer", style: "flex:1" }),
    el("span", { class: "tally", id: "totalTally" }),
    el("button", { class: "btn small", type: "button", text: "Save changes", onclick: savePack })
  ]));
  if (p.authored !== "owner"){
    wrap.appendChild(el("div", { class: "caution" }, [
      el("h3", { text: "This pack was written from public research, not by you" }),
      el("p", { text: "The questions and advice here are a first draft assembled from published sources. Review the wording, the points and the verdict bands against what you know before relying on it." })
    ]));
  }

  /* bands */
  var bandsEd = el("div", { class: "ed" });
  p.bands.forEach(function(b){
    bandsEd.appendChild(el("div", { class: "edq" }, [
      el("div", { class: "edrow" }, [
        el("label", { text: "From", style: "flex:none" }),
        el("input", { class: "num", type: "number", value: b.min, min: 0, max: 100,
          oninput: function(e){ b.min = +e.target.value; } }),
        el("input", { type: "text", value: b.title, oninput: function(e){ b.title = e.target.value; } })
      ]),
      el("textarea", { oninput: function(e){ b.body = e.target.value; } , value: b.body})
    ]));
  });
  bandsEd.querySelectorAll("textarea").forEach(function(t, i){ t.value = p.bands[i].body; });
  wrap.appendChild(el("div", { class: "panel" }, [
    el("span", { class: "eyebrow", text: "What each score means" }),
    el("h2", { text: "Verdict bands", style: "margin:.3rem 0 .8rem" }),
    bandsEd
  ]));

  /* sections */
  p.sections.forEach(function(sec){
    var body = el("div", {});
    sec.questions.forEach(function(q, qi){
      var qBox = el("div", { class: "edq" });
      var ta = el("textarea", { rows: 2, oninput: function(e){ q.text = e.target.value; } });
      ta.value = q.text;
      qBox.appendChild(el("label", { text: "Question " + sec.id + (qi+1) }));
      qBox.appendChild(ta);
      q.options.forEach(function(o){
        var row = el("div", { class: "edrow", style: "margin-top:.4rem" }, [
          el("input", { type: "text", value: o.label, oninput: function(e){ o.label = e.target.value; } }),
          el("input", { class: "num", type: "number", value: o.points, min: 0,
            oninput: function(e){ o.points = +e.target.value; retally(p); } })
        ]);
        qBox.appendChild(row);
      });
      body.appendChild(qBox);
    });
    var tally = el("span", { class: "tally", "data-sec": sec.id });
    wrap.appendChild(el("div", { class: "panel" }, [
      el("div", { class: "sechead" }, [
        el("span", { class: "eyebrow", text: "Section " + sec.id }),
        el("h2", { text: sec.name, style: "margin:.2rem 0 .8rem;width:100%" })
      ]),
      el("div", { class: "edrow", style: "margin-bottom:.7rem" }, [
        el("label", { text: "Section total", style: "flex:none" }),
        el("input", { class: "num", type: "number", value: sec.max, min: 0,
          oninput: function(e){ sec.max = +e.target.value; retally(p); } }),
        tally
      ]),
      body
    ]));
  });
  setTimeout(function(){ retally(p); }, 0);
  return wrap;
}

function retally(p){
  var total = 0, bad = false;
  p.sections.forEach(function(sec){
    var m = sec.questions.reduce(function(a,q){ return a + maxPts(q); }, 0);
    total += m;
    var node = document.querySelector('.tally[data-sec="' + sec.id + '"]');
    if (node){
      var ok = m === sec.max;
      node.className = "tally " + (ok ? "good" : "bad");
      node.textContent = ok ? "✓ options add up to " + m : "options add up to " + m + " — does not match";
      if (!ok) bad = true;
    }
  });
  var t = document.querySelector("#totalTally");
  if (t){
    var ok = total === 100 && !bad;
    t.className = "tally " + (ok ? "good" : "bad");
    t.textContent = ok ? "✓ 100 points" : total + " points total";
  }
}

function savePack(){
  var p = PACKS[editingPack];
  if (!DB) return alert("No database on this version of the page.");
  DB.doc("packs/" + p.id).set(JSON.parse(JSON.stringify(p))).then(function(){
    var t = document.querySelector("#totalTally");
    if (t){ t.className = "tally good"; t.textContent = "✓ Saved"; setTimeout(function(){ retally(p); }, 1600); }
  }).catch(function(e){
    alert(e && e.code === "invalid_argument"
      ? "Saving needs edit access to this artifact."
      : "Could not save. Try again.");
  });
}

function adminSubs(){
  var wrap = el("div", { class: "stack" });
  wrap.appendChild(el("div", { class: "admin-bar" }, [
    el("span", { class: "chip", id: "subCount", text: "loading…" }),
    el("span", { style: "flex:1" }),
    el("button", { class: "btn ghost small", type: "button", text: "Export CSV", onclick: exportCsv })
  ]));
  var host = el("div", { class: "panel scroller", id: "subsHost" }, [ el("p", { text: "Loading submissions…", style: "color:var(--ink-3)" }) ]);
  wrap.appendChild(host);

  DB.collection("submissions").orderBy("at", "desc").limit(500).get().then(function(snap){
    subsCache = snap.docs.map(function(d){ var o = d.data(); o._id = d.id; return o; });
    document.querySelector("#subCount").textContent = subsCache.length + " recorded";
    host.innerHTML = "";
    if (!subsCache.length){ host.appendChild(el("p", { text: "Nothing recorded yet.", style: "color:var(--ink-3)" })); return; }
    var t = el("table", { class: "subs" });
    t.appendChild(el("tr", {}, ["When","Country","Score","Verdict","Red flags"].map(function(h){ return el("th", { text: h }); })));
    subsCache.forEach(function(s){
      t.appendChild(el("tr", {}, [
        el("td", { class: "n", text: (s.at||"").slice(0,16).replace("T"," ") }),
        el("td", { text: s.countryName || s.country || "" }),
        el("td", { class: "n", text: s.score + "/" + s.max }),
        el("td", { text: s.band || "" }),
        el("td", { class: "n", text: (s.stops||[]).length ? (s.stops||[]).length + " stop" : "—" })
      ]));
    });
    host.appendChild(t);
  }).catch(function(){
    host.innerHTML = "";
    host.appendChild(el("p", { text: "Could not load submissions.", style: "color:var(--ink-3)" }));
  });
  return wrap;
}

function exportCsv(){
  if (!subsCache.length) return;
  var cols = ["at","countryName","score","max","band","stops","warns"];
  var rows = [cols.join(",")].concat(subsCache.map(function(s){
    return cols.map(function(c){
      var val = Array.isArray(s[c]) ? s[c].join(" ") : (s[c] === undefined ? "" : s[c]);
      return '"' + String(val).replace(/"/g, '""') + '"';
    }).join(",");
  })).join("\n");
  claude.use("downloads").then(function(d){
    if (d) return d.save({ filename: "submissions.csv", data: rows });
    fallbackCsv(rows);
  }).catch(function(){ fallbackCsv(rows); });
}
function fallbackCsv(rows){
  var w = window.open("", "_blank");
  if (w){ w.document.write("<pre>" + rows.replace(/[<&]/g, function(c){ return c === "<" ? "&lt;" : "&amp;"; }) + "</pre>"); }
}

/* ================= boot ================= */
$("#restartBtn").addEventListener("click", function(){
  S.knock = {}; S.ans = {}; S.saved = null; S.packId = null; S.step = "pick"; ADMIN_VIEW = false; render();
});
$("#adminBtn").addEventListener("click", function(){ ADMIN_VIEW = !ADMIN_VIEW; editingPack = null; render(); });

render();

/* db lights up later, if this deployment has it */
(async function(){
  if (typeof claude === "undefined" || !claude.use) return;
  DB = await claude.use("db");
  if (!DB) return;
  try {
    var snap = await DB.collection("packs").get();
    snap.docs.forEach(function(d){
      var p = d.data();
      if (p && p.id && p.sections) PACKS[p.id] = p;
    });
    if (S.step === "pick") render();
  } catch (e) { /* falls back to the built-in packs */ }
  IS_ADMIN = await probeAdmin();
  if (IS_ADMIN) $("#adminBtn").classList.remove("hidden");
})();
</script>
</body>
</html>
